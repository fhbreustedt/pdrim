<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDRIM - Racionalização v7.5 (Sync Selection)</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

    <header>
        <h1>PDRIM: GUIA R-BPM</h1>
        <p>Fase 3: Racionalizar - Planejamento da Solução</p>
    </header>

    <nav class="page-navigation">
        <a href="index.html" class="btn-nav">Página Inicial</a>
        <a href="#" class="btn-nav disabled">&laquo; Anterior (Descobrir)</a>
        <a href="racionalizar.html" class="btn-nav active">Atual (Racionalizar)</a>
        <a href="#" class="btn-nav disabled">Próximo (Implementar) &raquo;</a>
    </nav>

    <main class="main-wrapper">
    <div class="content-box" id="formContainer">
        <label id="formTitle" style="font-size: 1.1rem; color: var(--dark-accent); margin-bottom: 15px; font-weight: 800;">Ação Racionalizada</label>
        <form id="pdrimForm">
            <input type="hidden" id="editId">
            <div class="form-row-1">
                <div><label>Título da Ação</label><input type="text" id="title" required></div>
                <div><label>Categoria</label>
                    <select id="cat" required>
                        <option value="Capacitação">Capacitação</option>
                        <option value="Gestão da Mudança">Gestão da Mudança</option>
                        <option value="Tecnologia">Tecnologia</option>
                        <option value="Implantação">Implantação</option>
                        <option value="Definição de Riscos">Definição de Riscos</option>
                        <option value="Tratamento de Riscos">Tratamento de Riscos</option>
                        <option value="Metas e Indicadores">Metas e Indicadores</option>
                    </select>
                </div>
                <div><label>Início</label><input type="date" id="start" required></div>
                <div><label>Fim</label><input type="date" id="end" required></div>
            </div>
            <div id="editor-wrapper"><div id="editor-container"></div></div>
            <div class="button-group">
                <button type="submit" class="btn-main">Salvar Ação</button>
                <button type="button" class="btn-main btn-cancel" onclick="resetForm()">Cancelar</button>
            </div>
        </form>
    </div>

    <div class="content-box" id="capture-area">
        <div class="timeline-controls" id="non-printable-controls">
            <div class="control-group">
                <label>Filtro</label>
                <select id="filter" onchange="render()"><option value="all">Todas as Categorias</option></select>
            </div>
            <div class="button-group">
                <button class="btn-main" onclick="openNewForm()">NOVA AÇÃO</button>
                <button class="btn-main btn-danger" id="btnDeleteToggle" onclick="toggleDeleteMode()">EXCLUIR AÇÃO</button>
                <div class="dropdown">
                    <button class="btn-main btn-secondary" onclick="toggleDropdown(event)">OUTRAS AÇÕES</button>
                    <div class="dropdown-content" id="otherActionsDropdown">
                        <a href="#" onclick="document.getElementById('import-file').click(); return false;">Importar</a>
                        <a href="#" onclick="exportJSON(); return false;">Exportar</a>
                        <a href="#" onclick="savePDF(); return false;">Salvar PDF</a>
                    </div>
                </div>
            </div>
        </div>
        
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importJSON(this)">
        <div class="bulk-actions" id="bulkActions">
            <button class="btn-main btn-secondary" onclick="selectAll(true)">Selecionar Todos</button>
            <button class="btn-main btn-secondary" onclick="selectAll(false)">Nenhum</button>
            <button class="btn-main btn-danger" onclick="confirmBulkDelete()">Excluir Selecionados</button>
        </div>

        <div class="legend-container" id="legend"></div>
        <div class="view-switcher">
            <button id="btn-view-timeline" class="view-tab active" onclick="switchView('timeline')">Timeline</button>
            <button id="btn-view-table" class="view-tab" onclick="switchView('table')">Tabela</button>
        </div>
         <div id="views-container">
            <div id="timeline-view">
                <div id="timeline-root"></div>
            </div>
            <div id="table-view" style="display: none;">
                <table class="actions-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" class="delete-checkbox-header" onchange="selectAll(this.checked)"></th>
                            <th class="sortable" data-col="title" onclick="sortTable('title')">Título <span class="sort-icon"></span></th>
                            <th class="sortable" data-col="cat" onclick="sortTable('cat')">Categoria <span class="sort-icon"></span></th>
                            <th class="sortable" data-col="start" onclick="sortTable('start')">Início <span class="sort-icon"></span></th>
                            <th class="sortable" data-col="end" onclick="sortTable('end')">Fim <span class="sort-icon"></span></th>
                            <th class="sortable" data-col="status" onclick="sortTable('status')">Status <span class="sort-icon"></span></th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
    </main>

    <footer>
        <p>PDRIM Project &copy; 2026 - Desenvolvido por Fernando Breustedt</p>
    </footer>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="js/racionalizar.js"></script>
</body>
</html>
